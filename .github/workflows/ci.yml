name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_demo:
        description: "Also run the full synthetic demo pipeline (slower)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
          python -c "import glucotwin; print('glucotwin', glucotwin.__version__)"

      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests (synthetic fixtures only, CGMacros never needed)
        run: pytest -q --junitxml=test-results/junit.xml

      - name: Synthetic smoke run
        run: python scripts/run_pipeline.py --demo --smoke --out ci-smoke

      - name: Repository safety check
        run: python scripts/check_repo_safety.py

      - name: Full synthetic demo run (manual trigger only)
        if: github.event_name == 'workflow_dispatch' && inputs.full_demo
        run: python scripts/run_pipeline.py --demo --out ci-full-demo

      - name: Keep test results and synthetic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results
          path: |
            test-results/
            ci-smoke/reports/
            ci-full-demo/reports/
          if-no-files-found: ignore
