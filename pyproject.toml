[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glucotwin"
version = "0.1.0"
description = "GlucoTwin: personalised glucose digital twin research prototype (team kabhinav24)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "pyarrow>=15",
    "pyyaml>=6",
    "plotly>=5.20",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = ["ignore::UserWarning:sklearn.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", "models", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]
